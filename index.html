<script>
    const api = path => path;
    let currentPlayingUrl = null;

    const downloadMp3 = (url, title) => window.location.href = `${api('/api/download/song')}?url=${encodeURIComponent(url)}&title=${encodeURIComponent(title)}`;

    function togglePlay(url, title, author, thumb, btnId) {
        const audio = document.getElementById('audioPlayer'), bar = document.getElementById('playerBar'), btn = document.getElementById(btnId), songCard = btn.closest('.song-card');
        
        document.querySelectorAll('.btn-play').forEach(b => { b.innerHTML = '<span>▶️ Putar</span>'; b.classList.remove('playing'); });

        if (currentPlayingUrl === url && !audio.paused) return audio.pause(), currentPlayingUrl = null;

        currentPlayingUrl = url;
        songCard.appendChild(bar);
        bar.style.display = 'flex';
        ['playerTitle', 'playerArtist', 'playerThumb'].forEach((id, i) => document.getElementById(id)[i === 2 ? 'src' : 'textContent'] = [title, author, thumb][i]);

        audio.pause();
        audio.src = `${api('/api/play/song')}?url=${encodeURIComponent(url)}`;
        audio.load();
        audio.play().catch(e => console.log('Play info:', e));

        const setBtnState = (isPlaying) => {
            btn.innerHTML = isPlaying ? '<span>⏸️ Stop</span>' : '<span>▶️ Putar</span>';
            if (isPlaying) btn.classList.add('playing'); else btn.classList.remove('playing');
        };

        setBtnState(true);
        audio.onended = () => { setBtnState(false); currentPlayingUrl = null; };
        audio.onpause = () => setBtnState(false);
        audio.onplay = () => setBtnState(true);
    }

    const showGuide = () => alert('PANDUAN DOWNLOAD MP3\n\n1. Cari lagu yang kamu inginkan.\n2. Tekan tombol Putar dan pastikan preview lagunya bisa diputar sampai keluar suara.\n3. Kalau lagu bisa diputar, tekan tombol Download MP3 pada lagu tersebut.');

    async function searchSongs() {
        const q = document.getElementById('songQuery').value.trim();
        if (!q) return alert('Silakan ketik judul lagu terlebih dahulu!');

        const btn = document.getElementById('btnSearch'), loader = document.getElementById('songLoading'), list = document.getElementById('songResults'), header = document.getElementById('songListHeader'), empty = document.getElementById('songEmpty');
        btn.disabled = true; loader.style.display = 'block'; list.innerHTML = ''; header.style.display = empty.style.display = 'none';

        try {
            const res = await fetch(api(`/api/search?q=${encodeURIComponent(q)}`));
            const json = await res.json();

            if (json.success && json.data.length > 0) {
                header.style.display = 'flex';
                list.innerHTML = json.data.map((item, index) => {
                    const btnId = `btnPlay_${index}`, safeTitle = item.title.replace(/'/g, "\\'").replace(/"/g, '&quot;'), safeAuthor = item.author.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    return `<div class="song-card">
                        <div class="song-idx">${index + 1}</div>
                        <div class="thumb-wrapper"><img class="song-thumb" src="${item.thumbnail}" alt="Cover"><div class="thumb-play-overlay">🎵</div></div>
                        <div class="song-info">
                            <div class="song-title" title="${item.title}">${item.title}</div>
                            <div class="song-meta"><span>⏱️ ${item.duration}</span><span>👤 ${item.author}</span><span>👁️ ${item.views}</span></div>
                        </div>
                        <div class="song-actions">
                            <button class="btn-play" id="${btnId}" onclick="togglePlay('${item.url}', '${safeTitle}', '${safeAuthor}', '${item.thumbnail}', '${btnId}')"><span>▶️ Putar</span></button>
                            <button class="btn-download" onclick="downloadMp3('${item.url}', '${safeTitle}')"><span>⬇️ Unduh MP3</span></button>
                        </div>
                    </div>`;
                }).join('');
            } else {
                empty.innerHTML = `<div class="empty-icon">❌</div><p>Tidak ada hasil lagu yang ditemukan untuk "${q}". Coba kata kunci lain!</p>`;
                empty.style.display = 'block';
            }
        } catch (err) {
            alert('Gagal mengambil data lagu: ' + err.message);
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }
</script>
